<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>dTVSteams Personal</title>
<style>
:root{--bg:#141414;--surface:#1f1f1f;--text:#fff;--muted:#aaa;--red:#e50914;--radius:0.25rem;--gap:0.75rem}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0}
a{color:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;color:#000;padding:0.5rem}
nav.top{display:flex;align-items:center;gap:1rem;padding:0.75rem 1rem;background:linear-gradient(#000,transparent);position:sticky;top:0;z-index:10;background-color:rgba(0,0,0,.85)}
.logo{color:var(--red);font-weight:800;font-size:1.25rem;letter-spacing:.05em;margin:0}
.navlinks{display:flex;gap:1rem;font-size:0.875rem;color:var(--muted)}.navlinks a{text-decoration:none}.navlinks a[aria-current="page"]{color:var(--text)}
.search{margin-left:auto;display:flex;gap:0.5rem;align-items:center}
.search input{background:#000;border:1px solid #444;color:var(--text);padding:0.5rem;border-radius:var(--radius)}
.search button,.btn{background:var(--red);border:0;color:#fff;padding:0.5rem 1rem;border-radius:var(--radius);cursor:pointer;font-weight:600}
.btn.secondary{background:rgba(109,109,110,.7)}
.btn:focus-visible,.cardbtn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{position:relative;padding:3rem 1rem 2rem;min-height:40vh;display:flex;align-items:flex-end;background:linear-gradient(77deg,#000 20%,transparent 60%),linear-gradient(transparent 50%,var(--bg));}
.hero .inner{max-width:36rem}.kicker{color:var(--muted);letter-spacing:.2em;font-size:0.75rem}.hero h2{font-size:2rem;margin:0.5rem 0}.hero p{color:var(--muted)}.actions{display:flex;gap:0.5rem;margin-top:1rem}
section.rowsec{padding:0 0 0 1rem}section.rowsec h2{font-size:1.125rem;margin:1rem 0 0.5rem}
.row{display:flex;gap:var(--gap);overflow-x:auto;padding:0.5rem 1rem 1rem 0;scroll-snap-type:x mandatory}
.card{flex:0 0 15rem;scroll-snap-align:start;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid #333;transition:transform .15s}
.card:hover,.card:focus-within{transform:scale(1.04)}
.thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#3a3a3a,#101010)}
.cardbody{padding:0.5rem 0.75rem 0.75rem}.cardbody .t{font-size:0.875rem;margin:0 0 0.25rem}.badge{font-size:0.75rem;color:var(--muted)}
.cardbtn{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}
#meta{padding:0 1rem;color:var(--muted);font-size:0.875rem}
.notice{margin:0.5rem 1rem;padding:0.5rem 0.75rem;border-radius:var(--radius);background:#2a2a2a;border:1px solid #444}
.playerwrap{padding:0 1rem 3rem}video{width:100%;max-width:45rem;background:#000;border-radius:var(--radius)}
.skel{display:flex;gap:var(--gap);padding:0.5rem 1rem}.skel div{flex:0 0 15rem;aspect-ratio:16/9;background:#2a2a2a;border-radius:var(--radius);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
@media(max-width:40rem){.card{flex-basis:10rem}.hero h2{font-size:1.5rem}.navlinks{display:none}}
</style>
</head>
<body>
<a class="skip" href="#rows">跳到片單</a>
<nav class="top" aria-label="主導覽"><h1 class="logo">dTVSteams</h1>
<div class="navlinks"><a href="#" aria-current="page">首頁</a><a href="#rows">影集</a><a href="#player">我的片單</a></div>
<div class="search"><input id="q" type="search" aria-label="搜尋集數" placeholder="搜尋"><button id="refresh">手動更新</button></div>
</nav>
<div id="alert"></div>
<header class="hero"><div class="inner"><div class="kicker">本週精選</div><h2 id="herotitle">載入中…</h2><p id="herometa"></p>
<div class="actions"><button class="btn" id="heroplay">▶ 播放</button><button class="btn secondary" id="heroinfo">更多資訊</button></div></div></header>
<div id="meta" role="status"></div>
<section class="rowsec" aria-labelledby="rowh"><h2 id="rowh">最新上架</h2><div class="row" id="rows"><div class="skel" aria-hidden="true"><div></div><div></div><div></div></div></div></section>
<section class="playerwrap" aria-labelledby="ph"><h2 id="ph">播放器 (Part 1→2→3)</h2>
<video id="player" controls preload="metadata"></video><div id="parts" style="margin-top:0.5rem"></div><p id="ts" style="color:var(--muted)"></p></section>
<script src="./app.js"></script>
</body>
</html>
