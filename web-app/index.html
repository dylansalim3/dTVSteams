<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dTVStream - 綜藝玩很大線上看</title>
  <link rel="stylesheet" href="./vendor/video-js.min.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a href="#episodes-section" class="skip-link">跳到影片清單</a>

  <!-- YouTube-Style Header -->
  <header class="yt-header" role="banner">
    <div class="yt-header-left">
      <a href="./" class="yt-brand" aria-label="dTVStream 首頁">
        <div class="yt-logo-badge">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
            <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 22c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 2c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
          </svg>
        </div>
        <span class="yt-brand-title">dTVStream</span>
        <span class="yt-brand-sub">綜藝玩很大</span>
      </a>
    </div>

    <div class="yt-header-center">
      <div class="yt-search-box">
        <input type="search" id="q" placeholder="搜尋集數、日期、地名 (例如: 嘉義, 11-08)..." aria-label="搜尋集數">
        <button id="search-clear-btn" class="yt-search-clear" aria-label="清除搜尋" style="display:none;">✕</button>
      </div>
    </div>

    <div class="yt-header-right">
      <a href="./react/" class="yt-btn yt-btn-secondary" style="font-size:0.85rem; padding: 6px 14px; text-decoration: none; border-radius: 20px;" title="切換至 Video.js 10 React 官方組件版">React v10 版</a>
      <span class="yt-status-badge" id="catalog-status">載入中...</span>
      <button class="yt-icon-btn" id="refresh-btn" aria-label="重新整理集數清單" title="重新整理">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="yt-main" role="main">
    <!-- Theater / Active Video Player Section -->
    <section class="yt-player-section" aria-label="目前播放影片">
      <div class="yt-player-container">
        <video
          id="main-player"
          class="yt-native-player video-js vjs-theme-yt"
          controls
          preload="auto"
          playsinline
          webkit-playsinline
          poster="./media/thumb-default.svg"
        >
          <source src="./media/sample-part1.mp4" type="video/mp4">
          您的瀏覽器不支援 HTML5 影片播放。
        </video>
      </div>

      <!-- Video Details & Part Selector Under Player -->
      <div class="yt-player-details">
        <div class="yt-details-header">
          <h1 class="yt-video-title" id="player-title">請選擇下方集數開始播放</h1>
          <div class="yt-video-actions">
            <button class="yt-btn yt-btn-secondary" id="open-source-btn" aria-label="在外部新視窗開啟來源網頁">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
              <span>來源網頁</span>
            </button>
          </div>
        </div>

        <div class="yt-meta-row">
          <span class="yt-meta-pill yt-badge-red" id="player-part-badge">Part 1</span>
          <span class="yt-meta-pill" id="player-date-badge">2026</span>
          <span class="yt-meta-pill">1080p HD</span>
          <span class="yt-meta-pill">自動連續播放</span>
          <span class="yt-meta-pill yt-speed-pill" id="player-speed-badge">⚡ 1.0x</span>
          <span class="yt-stream-source" id="player-stream-status">串流狀態：準備中</span>
        </div>

        <!-- Part Picker Pills (Part 1, Part 2, Part 3) -->
        <div class="yt-parts-picker" id="player-parts-nav" role="group" aria-label="集數分段切換"></div>

        <!-- Playback Speed Picker (0.75x, 1.0x, 1.25x, 1.5x, 1.75x, 2.0x) -->
        <div class="yt-speed-picker" id="player-speed-picker" role="group" aria-label="播放速度調整">
          <span class="yt-speed-label">播放速度：</span>
          <button class="yt-speed-chip" data-speed="0.75" aria-label="切換至 0.75 倍速">0.75x</button>
          <button class="yt-speed-chip active" data-speed="1.0" aria-label="切換至 1.0 倍速">1.0x (正常)</button>
          <button class="yt-speed-chip" data-speed="1.25" aria-label="切換至 1.25 倍速">1.25x (推薦)</button>
          <button class="yt-speed-chip" data-speed="1.5" aria-label="切換至 1.5 倍速">1.5x (快看)</button>
          <button class="yt-speed-chip" data-speed="1.75" aria-label="切換至 1.75 倍速">1.75x</button>
          <button class="yt-speed-chip" data-speed="2.0" aria-label="切換至 2.0 倍速">2.0x (超快)</button>
        </div>

        <!-- Resume Notice Banner -->
        <div id="player-resume-toast" class="yt-resume-toast" style="display:none;" role="status"></div>
      </div>
    </section>

    <!-- Simple Episode List Section (YouTube Grid) -->
    <section class="yt-list-section" id="episodes-section" aria-label="集數列表">
      <div class="yt-section-header">
        <h2 class="yt-section-title">全部集數列表</h2>
        <span class="yt-item-count" id="episode-count-badge">共 10 集</span>
      </div>

      <div class="yt-episodes-grid" id="episodes-grid">
        <!-- Rendered dynamically -->
      </div>

      <!-- Load More / Pagination Bar -->
      <div class="yt-pagination-bar" id="pagination-bar">
        <button class="yt-btn yt-btn-load-more" id="load-more-btn" aria-label="載入更多歷史集數">
          <span class="yt-load-icon">▼</span>
          <span id="load-more-text">載入更多歷史集數 (第 2 頁 / 共 64 頁)</span>
        </button>
        <span class="yt-pagination-info" id="pagination-info">已顯示 10 集 / 全劇 640+ 集</span>
      </div>
    </section>
  </main>

  <!-- YouTube Footer -->
  <footer class="yt-footer" role="contentinfo">
    <p>dTVStream 個人播放平台 · 快捷鍵支援：<code>Space / Enter</code> (播放/暫停)、<code>← / →</code> (快退/快進 10s)、<code>1 / 2 / 3</code> (切換分段)、<code>&gt; / &lt;</code> (倍速調整)、<code>F</code> (全螢幕)</p>
  </footer>

  <script src="./frame-thumbnails.js"></script>
  <script src="./app.js"></script>
</body>
</html>
